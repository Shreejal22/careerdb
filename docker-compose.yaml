services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: careerdb-postgres
    environment:
      POSTGRES_DB: careerdb
      POSTGRES_USER: careerdb
      POSTGRES_PASSWORD: careerdb_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerdb -d careerdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: careerdb-redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: